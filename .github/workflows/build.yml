name: Site

# Every pull request and push builds the site: the docs from versioncam as npm
# publishes it, then Astro. A push to main also deploys it to version.cam, and
# so does a daily run — the docs come from the latest release, so a release is
# on the site by the next morning without anyone touching this repository.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Deploys from main only, and only once the Cloudflare secrets are in
      # this repository's settings; a pull request never sees them.
      - name: Deploy to version.cam
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No Cloudflare token in this repository yet; built, not deployed."
            exit 0
          fi
          npx wrangler deploy
